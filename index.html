<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Time Sheet">
  <meta name="theme-color" content="#F4F5F8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <title>Time Sheet</title>
  <style>
    :root {
      --bg: #F4F5F8;
      --card: #FFFFFF;
      --border: #E7E8EC;
      --border-strong: #B9BBC2;
      --ink: #1C1C1E;
      --muted: #8E8E93;
      --line: #EFF0F3;
      --track: #EEF0F3;
      --accent: #1C1C1E;
      --danger: #E5484D;
      --go: #2F9E6B;
      --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px rgba(16, 24, 40, .05);
      --ease: cubic-bezier(.32, .72, 0, 1);
      --glass: rgba(255, 255, 255, .72);
      color-scheme: light;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; background: var(--bg); }
    body {
      font-family: "Poppins", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    body.locked { overflow: hidden; }
    button, input, textarea { font: inherit; color: inherit; }
    button { background: none; border: 0; cursor: pointer; touch-action: manipulation; }
    .num { font-variant-numeric: tabular-nums; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Layout */
    .app {
      max-width: 560px;
      margin: 0 auto;
      padding: 0 16px calc(120px + env(safe-area-inset-bottom));
    }
    .top {
      position: sticky; top: 0; z-index: 4;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin: 0 -16px; padding: calc(env(safe-area-inset-top) + 8px) 16px 10px;
      background: rgba(244, 245, 248, .78);
      -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    }
    .top h1 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; min-width: 0; }
    .top .title { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none;
      transition: transform .2s var(--ease), background-color .2s;
    }
    .icon-btn:active { transform: scale(.9); }
    .icon-btn svg { width: 20px; height: 20px; }
    .glass-btn { background: var(--card); box-shadow: 0 0 0 1px var(--border), 0 2px 8px rgba(16, 24, 40, .05); }
    .content { display: flex; flex-direction: column; gap: 26px; padding-top: 8px; }
    .switch { animation: switch .4s var(--ease); }
    @keyframes switch { from { opacity: 0; transform: translateY(8px); } }

    .card { background: var(--card); border-radius: 26px; box-shadow: var(--shadow); }

    /* Summary */
    .summary { padding: 18px 18px 22px; text-align: center; }
    .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .month-nav button.label-btn { font-size: 15px; font-weight: 600; padding: 4px 10px; }
    .month-nav .icon-btn { width: 34px; height: 34px; }
    .month-nav .icon-btn svg { width: 18px; height: 18px; }
    .sum-label { font-size: 13px; color: var(--muted); font-weight: 500; }
    .sum-total { font-size: 40px; font-weight: 600; letter-spacing: -.03em; line-height: 1.2; }
    .sum-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .sum-sub b { color: var(--ink); font-weight: 600; }

    /* Sections */
    .section-head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 10px; }
    h2 { font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
    .pill-btn {
      height: 34px; padding: 0 14px; border-radius: 17px; background: var(--card);
      box-shadow: 0 0 0 1px var(--border); font-size: 14px; font-weight: 500; flex: none;
      transition: transform .2s var(--ease);
    }
    .pill-btn:active { transform: scale(.95); }

    .badge {
      width: 40px; height: 40px; border-radius: 50%; flex: none;
      display: grid; place-items: center;
      background: color-mix(in srgb, var(--c) 22%, #FFFFFF);
      color: color-mix(in srgb, var(--c) 72%, #000000);
    }
    .badge .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
    .badge.sm { width: 24px; height: 24px; }
    .badge.sm .dot { width: 8px; height: 8px; }

    .list { padding: 4px 16px; }
    .list > * + * { border-top: 1px solid var(--line); }
    .row {
      display: grid; grid-template-columns: 40px 1fr auto; align-items: center;
      column-gap: 14px; width: 100%; padding: 12px 0; text-align: left;
      transition: opacity .2s;
    }
    .row:active { opacity: .55; }
    .row-name { font-size: 15px; font-weight: 500; }
    .row-meta { font-size: 13px; color: var(--muted); }
    .row-main { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .row-amt { font-size: 15px; font-weight: 600; text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
    .row-amt small { font-size: 12px; font-weight: 400; color: var(--muted); }
    .empty { text-align: center; color: var(--muted); padding: 26px 20px; font-size: 14px; line-height: 1.5; }

    /* Work log */
    .day + .day { margin-top: 22px; }
    .day-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 6px 8px; }
    .day-head strong { font-size: 15px; font-weight: 600; }
    .day-head span { font-size: 13px; color: var(--muted); font-weight: 500; }
    .entries { display: flex; flex-direction: column; gap: 10px; }
    .entry {
      display: flex; flex-direction: column; gap: 12px; width: 100%; text-align: left;
      padding: 14px; border-radius: 28px; background: var(--card); box-shadow: var(--shadow);
      border-left: 0; transition: transform .2s var(--ease);
    }
    .entry:active { transform: scale(.985); }
    .entry-top { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 120px; }
    .entry-left > span { display: block; }
    .entry-left { display: flex; flex-direction: column; justify-content: space-between; padding: 4px 0 4px 6px; min-width: 0; }
    .entry-times { display: block; font-size: 14px; font-weight: 600; line-height: 1.4; }
    .entry-times span { color: var(--muted); font-weight: 400; }
    .entry-tag { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 4px; }
    .entry-total { display: block; font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
    .entry-total small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-bottom: 2px; }
    .entry-photos {
      display: grid; gap: 4px; border-radius: 20px; overflow: hidden; background: var(--track);
      grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr);
    }
    .entry-photos.n2 { grid-template-columns: 1fr 1fr; }
    .entry-photos.n3 { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
    .entry-photos.n3 > :first-child { grid-row: span 2; }
    .entry-photos.n4 { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
    .entry-photos .ph { position: relative; min-height: 0; min-width: 0; }
    .entry-photos img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .entry-photos .more {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: rgba(16, 24, 40, .45); color: #fff; font-weight: 600; font-size: 17px;
    }
    .entry-photos.none { place-items: center; color: #C3C5CC; background: repeating-linear-gradient(-45deg, #F6F7F9 0 8px, #F1F2F5 8px 16px); }
    .entry-photos.none svg { width: 26px; height: 26px; }
    .entry-desc {
      display: block; font-size: 14px; line-height: 1.5; color: #3A3A3F; padding: 10px 6px 2px; border-top: 1px solid var(--line);
      white-space: pre-wrap; word-break: break-word;
    }
    .entry-desc.muted { color: var(--muted); }

    /* Bottom button */
    .dock {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
      padding: 20px 16px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 60%, rgba(244, 245, 248, 0));
      display: flex; justify-content: center;
    }
    .primary-btn {
      width: 100%; max-width: 528px; height: 54px; border-radius: 27px;
      background: var(--btn, var(--accent)); color: var(--btn-ink, #FFFFFF); font-size: 16px; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      transition: transform .2s var(--ease), background-color .35s var(--ease), color .35s var(--ease);
    }
    .dock .primary-btn { box-shadow: 0 8px 24px rgba(16, 24, 40, .16); }
    .primary-btn:active { transform: scale(.97); }
    .primary-btn .live { width: 9px; height: 9px; border-radius: 50%; background: #FF5A5F; animation: pulse 1.6s infinite; }
    .primary-btn.paused .live { background: #F5B942; animation: none; }
    @keyframes pulse { 50% { opacity: .35; } }
    .secondary-btn {
      width: 100%; height: 50px; border-radius: 25px; background: var(--card); box-shadow: 0 0 0 1px var(--border);
      font-size: 15px; font-weight: 600; transition: transform .2s var(--ease);
    }
    .secondary-btn:active { transform: scale(.97); }
    .danger-btn { height: 44px; color: var(--danger); font-weight: 500; font-size: 15px; }

    /* Full-screen timer */
    .screen {
      position: fixed; inset: 0; z-index: 12; background: var(--bg);
      overflow-y: auto; overscroll-behavior: contain;
      transform: translateY(100%); visibility: hidden;
      transition: transform .55s var(--ease), visibility 0s .55s;
    }
    .screen.open { transform: none; visibility: visible; transition: transform .55s var(--ease); }
    .screen-inner {
      max-width: 560px; margin: 0 auto; min-height: 100%;
      padding: calc(env(safe-area-inset-top) + 8px) 18px calc(20px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 14px;
    }
    .screen-inner > * { flex-shrink: 0; }
    .screen-bar { display: flex; justify-content: space-between; align-items: center; }
    .clock { text-align: center; padding: 4px 0 10px; }
    .clock-time { font-size: 54px; font-weight: 600; letter-spacing: -.035em; line-height: 1.1; }
    .clock-time small { font-size: 22px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
    .clock-date { font-size: 15px; color: var(--muted); font-weight: 500; }
    .panel { display: flex; flex-direction: column; gap: 14px; flex: 1; }
    .label { font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 4px -6px; }

    .stopwatch {
      margin-top: auto; padding: 22px 16px 18px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .elapsed { font-size: 58px; font-weight: 600; letter-spacing: -.03em; line-height: 1.1; transition: color .3s; }
    .elapsed.idle { color: #CDCFD5; }
    .elapsed.paused { color: var(--muted); }
    .elapsed-meta { font-size: 14px; color: var(--muted); min-height: 21px; }
    .elapsed-meta b { color: var(--ink); font-weight: 600; }
    .timer-actions { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .timer-actions.two { grid-template-columns: 1fr 1fr; }
    .go-btn { --btn: var(--go); }

    /* Running: only the timer and its buttons, centered */
    .screen.focus .clock,
    .screen.focus #timerPanel > .label,
    .screen.focus #timerProjects,
    .screen.focus #timerDesc,
    .screen.focus .elapsed-meta { display: none; }
    .screen.focus #timerPanel { justify-content: center; gap: 28px; padding-bottom: 56px; animation: switch .45s var(--ease); }
    .screen.focus .stopwatch { margin-top: 0; padding: 0; }
    .screen.focus .elapsed { font-size: clamp(64px, 21vw, 104px); letter-spacing: -.04em; }
    .screen.focus .elapsed.paused { animation: pulse 1.6s infinite; }
    .screen.focus .timer-actions { width: 100%; max-width: 420px; align-self: center; }
    .stop-btn { --btn: var(--danger); }

    .done-card { padding: 20px 18px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .done-proj { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
    .done-total { font-size: 46px; font-weight: 600; letter-spacing: -.03em; line-height: 1.15; margin-top: 6px; }
    .done-times { font-size: 15px; font-weight: 500; }
    .done-times span { color: var(--muted); }
    .done-break { font-size: 13px; color: var(--muted); }
    .prompt { text-align: center; padding: 6px 10px 0; }
    .prompt h3 { font-size: 18px; font-weight: 600; }
    .prompt p { font-size: 14px; color: var(--muted); line-height: 1.45; }

    /* Photo pickers */
    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .photo-grid .tile {
      position: relative; aspect-ratio: 1; border-radius: 18px; overflow: hidden; background: var(--track);
    }
    .photo-grid .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-grid .tile .x {
      position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%;
      background: rgba(16, 24, 40, .55); color: #fff; display: grid; place-items: center;
    }
    .photo-grid .tile .x svg { width: 14px; height: 14px; }
    .photos { display: flex; flex-direction: column; gap: 10px; }
    .photo-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .photo-actions .add {
      height: 52px; border-radius: 18px; border: 1.5px dashed var(--border-strong); color: var(--ink);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 15px; font-weight: 500; transition: transform .2s var(--ease);
    }
    .photo-actions .add:active { transform: scale(.96); }
    .photo-actions .add svg { width: 22px; height: 22px; color: var(--muted); }
    .running-dot { color: var(--danger); }

    /* Sheets */
    .scrim {
      position: fixed; inset: 0; background: rgba(16, 24, 40, .22); opacity: 0; pointer-events: none;
      transition: opacity .4s var(--ease); z-index: 15;
    }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: var(--kb, 0px); z-index: 20;
      max-width: 560px; margin: 0 auto;
      max-height: calc(var(--vvh, 100dvh) - 24px); overflow-y: auto; overscroll-behavior: contain;
      background: var(--bg); border-radius: 30px 30px 0 0;
      padding: 8px 18px calc(16px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 14px;
      box-shadow: 0 -10px 40px rgba(16, 24, 40, .1);
      transform: translateY(110%); visibility: hidden;
      transition: transform .5s var(--ease), bottom .35s var(--ease), max-height .35s var(--ease), visibility 0s .5s;
    }
    .sheet.open {
      transform: none; visibility: visible;
      transition: transform .5s var(--ease), bottom .35s var(--ease), max-height .35s var(--ease);
    }
    .sheet > * { flex-shrink: 0; }
    .sheet::before { content: ""; align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #D9DBE0; flex: none; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-top: -4px; }
    .sheet-head h3 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }

    .field {
      display: block; width: 100%; font-size: 16px; line-height: 1.45; padding: 14px 16px; border-radius: 16px;
      border: 1px solid var(--border); background: var(--card); color: var(--ink); outline: none; resize: none;
      -webkit-appearance: none; appearance: none; transition: border-color .2s, box-shadow .2s;
    }
    textarea.field { min-height: 52px; overflow: hidden; }
    .field:focus { border-color: var(--border-strong); box-shadow: 0 0 0 4px rgba(16, 24, 40, .04); }
    .field::placeholder { color: var(--muted); }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 8px; max-width: 100%;
      border-radius: 20px; background: var(--card); border: 1px solid var(--border); font-size: 14px; font-weight: 500;
      transition: background-color .3s var(--ease), border-color .3s var(--ease), color .3s var(--ease), transform .2s var(--ease);
    }
    .chip:active { transform: scale(.95); }
    .chip.on { background: var(--c); border-color: var(--c); color: var(--on); }
    .chip.on .badge { background: rgba(255, 255, 255, .32); }
    .chip.on .badge .dot { background: currentColor; }
    .chip.add { padding: 0 16px; color: var(--muted); border-style: dashed; background: none; }

    .swatches { display: grid; grid-template-columns: repeat(8, 1fr); justify-items: center; padding: 4px 0; }
    .swatch { width: 30px; height: 30px; border-radius: 50%; background: var(--c); transition: box-shadow .2s, transform .2s var(--ease); }
    .swatch:active { transform: scale(.88); }
    .swatch.on { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--c); }

    .inline-field {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 0 16px; min-height: 52px; border-radius: 16px; background: var(--card); border: 1px solid var(--border); font-size: 16px;
      transition: border-color .2s;
    }
    .inline-field:focus-within { border-color: var(--border-strong); }
    .inline-field .in { display: flex; align-items: center; gap: 2px; color: var(--muted); }
    .inline-field input { border: 0; background: none; text-align: right; outline: none; color: var(--ink); min-width: 0; }
    .inline-field input.money { width: 90px; }
    .inline-field input.mins { width: 60px; }
    .inline-field input[type="datetime-local"] { font-size: 15px; -webkit-appearance: none; appearance: none; }
    .stack { display: flex; flex-direction: column; gap: 8px; }
    .hint { font-size: 13px; color: var(--muted); line-height: 1.5; padding: 0 4px; }
    .hint.center { text-align: center; }

    .settings { padding: 4px 16px; }
    .setting { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 0; }
    .setting + .setting { border-top: 1px solid var(--line); }
    .setting strong { font-size: 15px; font-weight: 600; display: block; margin-bottom: 2px; }
    .setting .hint { padding: 0; }
    .btn-row { display: flex; gap: 8px; flex: none; }

    /* Photo viewer */
    .viewer {
      position: fixed; inset: 0; z-index: 35; background: rgba(0, 0, 0, .94);
      display: grid; place-items: center; opacity: 0; visibility: hidden;
      transition: opacity .3s var(--ease), visibility 0s .3s;
    }
    .viewer.open { opacity: 1; visibility: visible; transition: opacity .3s var(--ease); }
    .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .viewer .icon-btn { position: absolute; top: calc(env(safe-area-inset-top) + 10px); right: 14px; background: rgba(255, 255, 255, .16); color: #fff; }
    .viewer .count { position: absolute; bottom: calc(env(safe-area-inset-bottom) + 18px); left: 0; right: 0; text-align: center; color: rgba(255, 255, 255, .7); font-size: 14px; }

    /* Frosted glass: toasts and dialogs */
    .glass {
      background: var(--glass);
      -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, .7);
      box-shadow: 0 12px 40px rgba(16, 24, 40, .14), 0 1px 2px rgba(16, 24, 40, .06);
    }
    .toast {
      position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 8px); z-index: 45;
      max-width: 420px; margin: 0 auto; padding: 12px 16px; border-radius: 22px;
      display: flex; align-items: center; gap: 12px; font-size: 14px; line-height: 1.35;
      transform: translateY(calc(-100% - 60px - env(safe-area-inset-top))) scale(.96); opacity: 0;
      transition: transform .55s var(--ease), opacity .35s var(--ease);
    }
    .toast.show { transform: none; opacity: 1; }
    .toast b { display: block; font-weight: 600; }
    .toast span { color: #4A4A50; }

    .dialog-wrap {
      position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 24px;
      background: rgba(16, 24, 40, .18); opacity: 0; visibility: hidden;
      transition: opacity .3s var(--ease), visibility 0s .3s;
    }
    .dialog-wrap.open { opacity: 1; visibility: visible; transition: opacity .3s var(--ease); }
    .dialog {
      width: min(320px, 100%); border-radius: 28px; padding: 22px 18px 18px; text-align: center;
      transform: scale(.92); transition: transform .45s var(--ease);
    }
    .dialog-wrap.open .dialog { transform: none; }
    .dialog h4 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
    .dialog p { font-size: 14px; color: #4A4A50; line-height: 1.45; margin-bottom: 18px; }
    .dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .dialog-actions button { height: 46px; border-radius: 23px; font-size: 15px; font-weight: 600; transition: transform .2s var(--ease); }
    .dialog-actions button:active { transform: scale(.96); }
    .dlg-cancel { background: rgba(255, 255, 255, .8); box-shadow: 0 0 0 1px var(--border); }
    .dlg-ok { background: var(--ink); color: #FFFFFF; }
    .dlg-ok.danger { background: var(--danger); }

    .shake { animation: shake .35s; }
    @keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { *, *::before { transition-duration: .01s !important; animation-duration: .01s !important; } }
  </style>
</head>
<body>
  <!-- Home: all projects -->
  <main class="app" id="home">
    <header class="top">
      <h1>Time Sheet</h1>
      <button class="icon-btn glass-btn" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg>
      </button>
    </header>
    <div class="content" id="homeContent">
      <section class="summary card">
        <p class="sum-label" id="homeMonth"></p>
        <p class="sum-total num" id="homeTotal"></p>
        <p class="sum-sub" id="homeSub"></p>
      </section>
      <section>
        <div class="section-head"><h2>Projects</h2><button class="pill-btn" id="newProjBtn">+ New</button></div>
        <div class="card list" id="projList"></div>
      </section>
    </div>
  </main>

  <!-- One project's work log -->
  <main class="app" id="projectView" hidden>
    <header class="top">
      <div class="title">
        <button class="icon-btn glass-btn" id="backBtn" aria-label="Back to projects">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <h1 class="truncate" id="projTitle"></h1>
      </div>
      <button class="icon-btn glass-btn" id="editProjBtn" aria-label="Edit project">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
      </button>
    </header>
    <div class="content" id="projContent">
      <section class="summary card">
        <div class="month-nav">
          <button class="icon-btn glass-btn" id="prevMonth" aria-label="Previous month">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <button class="label-btn" id="monthLabel" title="Back to this month"></button>
          <button class="icon-btn glass-btn" id="nextMonth" aria-label="Next month">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
        <p class="sum-label">Time worked</p>
        <p class="sum-total num" id="projTotal"></p>
        <p class="sum-sub num" id="projSub"></p>
      </section>
      <section>
        <div class="section-head"><h2>Work log</h2><button class="pill-btn" id="addEntryBtn">+ Add</button></div>
        <div id="logList"></div>
      </section>
    </div>
  </main>

  <div class="dock"><button class="primary-btn" id="dockBtn">Start timer</button></div>

  <!-- Full-screen timer -->
  <section class="screen" id="timer" role="dialog" aria-modal="true" aria-label="Timer">
    <div class="screen-inner">
      <div class="screen-bar">
        <button class="icon-btn glass-btn" id="timerClose" aria-label="Close timer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
      <div class="clock">
        <p class="clock-time num" id="clockTime"></p>
        <p class="clock-date" id="clockDate"></p>
      </div>

      <div class="panel" id="timerPanel">
        <p class="label">Project</p>
        <div class="chips" id="timerProjects"></div>
        <p class="label">Description</p>
        <textarea class="field" id="timerDesc" rows="2" placeholder="What are you working on?" maxlength="500"></textarea>
        <div class="stopwatch">
          <p class="elapsed num" id="elapsed">00:00:00</p>
          <p class="elapsed-meta num" id="elapsedMeta"></p>
        </div>
        <div class="timer-actions" id="timerActions"></div>
      </div>

      <div class="panel" id="finishPanel" hidden>
        <div class="card done-card">
          <span class="done-proj" id="doneProj"></span>
          <p class="done-total num" id="doneTotal"></p>
          <p class="done-times num" id="doneTimes"></p>
          <p class="done-break num" id="doneBreak"></p>
        </div>
        <textarea class="field" id="doneDesc" rows="1" placeholder="Description (optional)" maxlength="500"></textarea>
        <div class="prompt">
          <h3>Add proof of work?</h3>
          <p>Snap a photo of what you worked on. It's optional.</p>
        </div>
        <div class="photos" id="donePhotos"></div>
        <div class="stack" style="margin-top:auto">
          <button class="primary-btn" id="saveEntryBtn">Save to log</button>
          <button class="secondary-btn" id="resumeBtn">Resume timer</button>
          <button class="danger-btn" id="discardBtn">Discard this session</button>
        </div>
      </div>
    </div>
  </section>

  <div class="scrim" id="scrim"></div>

  <form class="sheet" id="projectSheet" autocomplete="off" novalidate>
    <div class="sheet-head">
      <h3 id="projHeading">New project</h3>
      <button type="button" class="icon-btn glass-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <input class="field" id="projName" placeholder="Project name, e.g. Website redesign" maxlength="40" enterkeyhint="next">
    <input class="field" id="projClient" placeholder="Client (optional)" maxlength="60" enterkeyhint="done">
    <label class="inline-field">
      <span>Hourly rate</span>
      <span class="in num">$<input class="money" id="projRate" inputmode="decimal" placeholder="30.00"></span>
    </label>
    <p class="label">Color</p>
    <div class="swatches" id="projColors"></div>
    <button class="primary-btn" type="submit" id="projSubmit">Save project</button>
    <button class="danger-btn" type="button" id="projDelete">Delete project</button>
  </form>

  <form class="sheet" id="entrySheet" autocomplete="off" novalidate>
    <div class="sheet-head">
      <h3 id="entryHeading">Edit entry</h3>
      <button type="button" class="icon-btn glass-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="chips" id="entryProjects"></div>
    <div class="stack">
      <label class="inline-field"><span>Started</span><input type="datetime-local" id="entryStart"></label>
      <label class="inline-field"><span>Stopped</span><input type="datetime-local" id="entryEnd"></label>
      <label class="inline-field"><span>Breaks</span><span class="in num"><input class="mins" id="entryBreak" inputmode="numeric" placeholder="0"> min</span></label>
    </div>
    <p class="hint center num" id="entryWorked"></p>
    <textarea class="field" id="entryDesc" rows="2" placeholder="Description (optional)" maxlength="500"></textarea>
    <p class="label">Photos</p>
    <div class="photos" id="entryPhotos"></div>
    <button class="primary-btn" type="submit">Save entry</button>
    <button class="danger-btn" type="button" id="entryDelete">Delete entry</button>
  </form>

  <div class="sheet" id="settingsSheet">
    <div class="sheet-head">
      <h3>Settings</h3>
      <button type="button" class="icon-btn glass-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="card settings">
      <div class="setting">
        <div><strong>Backup</strong><p class="hint">Your hours and photos are stored only on this device. Export now and then to keep a copy.</p></div>
        <div class="btn-row">
          <button class="pill-btn" id="exportBtn">Export</button>
          <button class="pill-btn" id="importBtn">Import</button>
        </div>
      </div>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>

  <!-- Two pickers: camera opens straight to the camera, library lets you choose existing photos -->
  <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
  <input type="file" id="libraryInput" accept="image/*" multiple hidden>

  <div class="viewer" id="viewer">
    <img id="viewerImg" alt="">
    <button class="icon-btn" id="viewerClose" aria-label="Close photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <p class="count num" id="viewerCount"></p>
  </div>

  <div class="toast glass" id="toast" role="status"></div>

  <div class="dialog-wrap" id="dialog">
    <div class="dialog glass" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle">
      <h4 id="dlgTitle"></h4>
      <p id="dlgMsg"></p>
      <div class="dialog-actions">
        <button type="button" class="dlg-cancel" id="dlgCancel">Cancel</button>
        <button type="button" class="dlg-ok" id="dlgOk">Delete</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
